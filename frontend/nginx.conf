server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA React Router : /produit/48213 n'est pas un fichier sur le disque,
    # on renvoie index.html et le routeur côté client prend le relais.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas de bloc proxy_pass vers l'API : le navigateur appelle directement
    # http://localhost:8000 (CORS autorisé côté FastAPI), ce qui préserve le
    # streaming de /chat.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
