[pytest]
testpaths = tests
# Les tests marqués `integration` ont besoin d'Ollama (et d'un index ChromaDB
# rempli) : ils sont EXCLUS par défaut. Pour les lancer explicitement :
#   pytest -m integration
addopts = -m "not integration"
markers =
    integration: nécessite un vrai serveur Ollama et une base ChromaDB indexée
